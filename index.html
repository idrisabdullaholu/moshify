<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moshify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div style="width: 50%; margin-top: 3rem; margin-left: 3rem">
      <div class="plan">
        <div class="card card--secondary">
          <header class="card__header">
            <h3 class="plan__name">Entry</h3>
            <span class="plan__price">$14</span>
            <span class="plan__billing-cycle">/month</span>
            <span class="badge badge--secondary badge--small">10% OFF</span>
            <span class="plan__description">Eazy start on the cloud</span>
          </header>
          <div class="card__body">
            <ul class="list list--tick">
              <li class="list__item">item 1</li>
              <li class="list__item">item 2</li>
              <li class="list__item">item 3</li>
            </ul>
            <button class="btn btn--outline btn--block">buy now</button>
          </div>
        </div>
      </div>
    </div>
    <div style="width: 30%; margin-top: 10rem">
      <div class="card card--primary">
        <header class="card__header">Card Header</header>
        <div class="card__body">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Eius,
          tempora.
        </div>
      </div>
    </div>
  </body>
</html>
